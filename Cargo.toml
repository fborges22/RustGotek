[package]
name = "rustgotek"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Manage Gotek USB media"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_extras = { version = "0.33", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.18"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
