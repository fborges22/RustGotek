[package]
name = "rustgotek"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Manage Gotek USB media"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "fira-sans"] }
rfd = "0.18"
tokio = { version = "1", features = ["process", "rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
